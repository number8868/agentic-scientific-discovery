name: nova-mat-opensource-live
description: NOVA-MAT live orchestration with host-owned dataset and SQLite context
# The SDK Codex harness is intentional: codex-native is an interactive terminal
# wrapper and exposes the native shell/file tools even when this YAML declares
# only function tools.  The launcher must also set the installed 0.16 Codex
# harness controls: HARNESS_CODEX_DISABLE_NATIVE_TOOLS=1 and
# HARNESS_CODEX_ENABLE_WEB_SEARCH=0.  These are environment controls in the
# open-source 0.16 harness, not YAML executor fields.
prompt: |
  You are the Scientist PI for one bounded live run. Preserve mode=live and
  never treat execution errors as findings. Dispatch Planner first. It must
  register both fixed candidates and recommend family_screen as the frozen
  primary protocol. Approve it with commit_initial_spec, give the returned ID
  to Runner, then give the stored Result to Skeptic. After Skeptic records a
  result-grounded review recommending threshold_sensitivity, approve it with
  commit_next_spec and ask Runner to execute the returned second ID. After
  Runner's second discovery Result, have Skeptic call submit_final_review, then call
  freeze_final. Return only the frozen protocol ID and holdout_experiment_id;
  do not execute the holdout because no controlled holdout Runner interface is
  available yet.
executor:
  harness: codex
  model: gpt-5.6-luna
cancellable: true
async: false
tools:
  commit_initial_spec:
    type: function
    callable: nova.decision_tools.commit_initial_spec
  commit_next_spec:
    type: function
    callable: nova.decision_tools.commit_next_spec
  freeze_final:
    type: function
    callable: nova.decision_tools.freeze_final
  planner:
    type: agent
    pass_history: true
    executor: {harness: codex, model: gpt-5.6-luna}
    prompt: Register both bounded proposals and choose family_screen as the frozen primary protocol using register_initial_plan.
    tools:
      register_initial_plan:
        type: function
        callable: nova.decision_tools.register_initial_plan
  runner:
    type: agent
    pass_history: true
    executor: {harness: codex, model: gpt-5.6-luna}
    prompt: Execute only the host-registered discovery experiment_id. Never execute a holdout.
    tools:
      execute_live_registered_experiment:
        type: function
        callable: nova.live_bridge.execute_live_registered_experiment
        parameters: {type: object, properties: {experiment_id: {type: string}}, required: [experiment_id], additionalProperties: false}
  skeptic:
    type: agent
    pass_history: true
    executor: {harness: codex, model: gpt-5.6-luna}
    prompt: Review the first result and submit one live concern. After the second discovery result, call submit_final_review; do not execute or authorize a holdout.
    tools:
      submit_live_review:
        type: function
        callable: nova.decision_tools.submit_live_review
      submit_final_review:
        type: function
        callable: nova.decision_tools.submit_final_review
policies:
  limit_tool_calls:
    type: function
    handler: omnigent.policies.builtins.safety.max_tool_calls_per_session
    factory_params: {limit: 16}
